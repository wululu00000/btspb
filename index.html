<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BTS Online Photo Booth</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- 引入 BTS 風格的現代極簡無襯線字體 Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box !important;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      font-family: 'Montserrat', Arial, sans-serif;
      position: relative;
      margin: 0;
    }

    /* 手機與電腦皆可完美顯示背景的寫法 */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('底圖.jpg') no-repeat center center;
      background-size: cover;
      z-index: -999;
    }

    /* 拍貼框主容器：50% 透明度黑色 */
    .container {
      position: relative;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      width: 780px;
      max-width: 95vw;
    }

    .booth-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 8px;
      margin-bottom: 6px;
    }

    .booth-title {
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    /* 第二行標題為紅色 */
    .sub-header-title {
      text-align: center;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #ef4444;
      margin-bottom: 15px;
      font-weight: 800;
    }

    .main-layout {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
    }

    .controls-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 50;
    }

    .preview-panel {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .camera-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #webcam.front-camera {
      transform: scaleX(-1);
    }

    #webcam.rear-camera {
      transform: scaleX(1);
    }

    #flash-effect {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      transition: opacity 0.1s ease-out;
    }

    #flash-effect.flash-active {
      opacity: 0.95;
    }

    /* 倒數計時數字為紅色 */
    #countdown-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 70px;
      font-weight: 900;
      color: #ef4444;
      text-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 10px rgba(239, 68, 68, 0.8);
      z-index: 999;
    }

    .flip-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 80;
      transition: all 0.2s ease;
    }

    .flip-btn:hover {
      background: rgba(56, 189, 248, 0.8);
      transform: rotate(180deg);
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      position: relative;
      z-index: 100;
      flex: 1;
      padding: 10px 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      color: #111;
      background: #e2e8f0;
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: #334155;
      color: #94a3b8;
      border-color: #475569;
    }

    .btn.secondary {
      background: #cbd5e1;
      color: #1e293b;
    }

    .btn.success {
      margin-top: 10px;
      width: 100%;
      font-size: 13px;
      background: #7dd3fc;
      color: #0f172a;
      border-color: #38bdf8;
    }

    .btn.video-btn {
      margin-top: 8px;
      width: 100%;
      font-size: 13px;
      background: #d4c5b9;
      color: #2c2521;
      border-color: #b5a395;
    }

    .picker-group {
      margin-top: 10px;
      width: 100%;
    }

    .picker-group label {
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 4px;
      display: block;
    }

    .options-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
    }

    .frame-option {
      height: 40px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 6px;
      cursor: pointer;
      overflow: hidden;
    }

    .frame-option.active {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }

    .frame-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    #photo-strip {
      position: relative;
      width: 240px;
      height: 720px;
      background-color: transparent;
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .photo-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    .photo-frame {
      position: absolute;
      left: 18px;
      width: 204px;
      height: 141px;
      background-color: #000;
      overflow: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-frame canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #frame-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      z-index: 5;
      pointer-events: none;
    }

    #final-result-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 20;
      object-fit: fill;
      cursor: pointer;
      display: none;
    }

    #final-result-img.printing-animation {
      animation: photoPrintSlide 1.8s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    @keyframes photoPrintSlide {
      0% { transform: translateY(-100%); opacity: 0.1; filter: brightness(2.5) contrast(0.5); }
      50% { opacity: 0.7; filter: brightness(1.3) contrast(0.9); }
      100% { transform: translateY(0); opacity: 1; filter: brightness(1) contrast(1); }
    }

    /* 左下角炸彈與對話框區域 */
    .bottom-left-area {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 99999;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      pointer-events: none;
    }

    .bottom-left-bomb {
      width: 100px;
      height: 100px;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .bottom-left-bomb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.9));
    }

    /* 💥 炸彈爆炸震動與放大動畫 */
    @keyframes bombExplode {
      0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.9)); }
      15% { transform: scale(1.3) rotate(-10deg); filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.9)); }
      30% { transform: scale(1.5) rotate(10deg); filter: drop-shadow(0 0 30px rgba(249, 115, 22, 1)); }
      45% { transform: scale(1.8) rotate(-15deg); filter: drop-shadow(0 0 45px rgba(239, 68, 68, 1)) brightness(1.6); }
      60% { transform: scale(2.2) rotate(10deg); filter: drop-shadow(0 0 60px white) brightness(2); }
      100% { transform: scale(2.5); opacity: 0; filter: drop-shadow(0 0 80px white); }
    }

    .bottom-left-bomb.exploding {
      animation: bombExplode 0.8s ease-out forwards;
    }

    /* 💥 爆炸衝擊波圓環 */
    @keyframes shockwave {
      0% { transform: scale(0.3); opacity: 1; border-color: #ef4444; }
      50% { border-color: #f97316; }
      100% { transform: scale(4); opacity: 0; border-color: #ffffff; }
    }

    .shockwave-ring {
      position: fixed;
      bottom: 45px;
      left: 45px;
      width: 60px;
      height: 60px;
      border: 5px solid #ef4444;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      display: none;
    }

    .shockwave-ring.active {
      display: block;
      animation: shockwave 0.7s ease-out forwards;
    }

    /* 炸彈旁邊的白底對話框 */
    .bomb-bubble {
      background: #ffffff;
      color: #111111;
      padding: 8px 14px;
      border-radius: 12px;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
      border: 2px solid #111111;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      animation: bubblePulse 2.5s ease-in-out infinite;
    }

    @keyframes bubblePulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (max-width: 650px) {
      .main-layout { flex-direction: column; align-items: center; }
      .container { width: 100%; padding: 12px; }
      .controls-panel { width: 100%; }
      .bottom-left-area { bottom: 10px; left: 10px; gap: 8px; }
      .bottom-left-bomb { width: 70px; height: 70px; }
      .bomb-bubble { font-size: 10px; padding: 5px 10px; }
      .shockwave-ring { bottom: 25px; left: 25px; width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="booth-header">
      <h1 class="booth-title">BTS Online Photo Booth</h1>
    </div>
    
    <div class="sub-header-title">BTS WORLD TOUR 'ARIRANG' IN KAOHSIUNG</div>

    <div class="main-layout">
      <!-- 左側控制與相機面板 -->
      <div class="controls-panel">
        <div class="camera-container">
          <video id="webcam" autoplay playsinline muted></video>
          <div id="flash-effect"></div>
          <div id="countdown-overlay"></div>
          <button id="flip-btn" class="flip-btn" title="切換前後鏡頭">🔄</button>
        </div>

        <div class="picker-group">
          <label>🖼️ 1. 請選擇專屬相框：</label>
          <div class="options-row">
            <div class="frame-option active" data-frame="JK_ARIRANG" data-slots="4">
              <img src="JK_ARIRANG.png" alt="JK Arirang">
            </div>
            <div class="frame-option" data-frame="JK_BD" data-slots="4">
              <img src="JK_BD.png" alt="JK BD">
            </div>
            <div class="frame-option" data-frame="RM_ARIRANG" data-slots="4">
              <img src="RM_ARIRANG.png" alt="RM Arirang">
            </div>
            <div class="frame-option" data-frame="RM_BD" data-slots="4">
              <img src="RM_BD.png" alt="RM BD">
            </div>
          </div>
        </div>

        <div class="buttons">
          <button id="start-btn" class="btn primary">2. 開始拍照 (START)</button>
          <button id="retake-btn" class="btn secondary" disabled>重新 (RESHOOT)</button>
        </div>

        <button id="download-btn" class="btn success" disabled>下載照片 (DOWNLOAD PHOTO)</button>
        <button id="download-video-btn" class="btn video-btn" disabled>下載影片 (DOWNLOAD VIDEO)</button>

        <!-- 🎵 嵌入 Spotify 播放器 -->
        <div style="margin-top: 12px; width: 100%; position: relative; z-index: 100;">
          <iframe style="border-radius:12px" src="https://open.spotify.com/embed/album/3ukkRHDHbN8tNRPKsGZR1h?utm_source=generator&theme=0&autoplay=1" width="100%" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
      </div>

      <!-- 右側拍貼預覽區 -->
      <div class="preview-panel">
        <div id="photo-strip">
          <div class="photo-layer">
            <div class="photo-frame"><canvas id="canvas1"></canvas></div>
            <div class="photo-frame"><canvas id="canvas2"></canvas></div>
            <div class="photo-frame"><canvas id="canvas3"></canvas></div>
            <div class="photo-frame"><canvas id="canvas4"></canvas></div>
          </div>

          <img id="frame-overlay" src="JK_ARIRANG.png" alt="相框">
          <img id="final-result-img" alt="長按儲存拍貼">
        </div>
      </div>
    </div>
  </div>

  <!-- 💣 左下角裝飾炸彈與對話框、爆炸衝擊波 -->
  <div class="bottom-left-area">
    <div id="bomb-container" class="bottom-left-bomb">
      <img src="炸彈裝飾.png" alt="炸彈裝飾">
    </div>
    <div id="bomb-bubble" class="bomb-bubble">방탄 방탄 방방탄!</div>
  </div>
  <div id="shockwave" class="shockwave-ring"></div>

  <!-- 隱藏錄影 Canvas -->
  <div id="hidden-recorder-container" style="display:none;">
    <canvas id="video-record-canvas" width="240" height="720"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 💣 炸彈白底對話框 3-5 秒隨機跳字邏輯
      const btsPhrases = [
        '김남준', '김석진', '민윤기', '정호석', 
        '박지민', '김태형', '전정국', 'B-T-S', '방탄 방탄 방방탄!'
      ];
      const bombBubble = document.getElementById('bomb-bubble');
      const bombContainer = document.getElementById('bomb-container');
      const shockwave = document.getElementById('shockwave');

      function changeBubbleText() {
        if (bombBubble) {
          const randomIndex = Math.floor(Math.random() * btsPhrases.length);
          bombBubble.innerText = btsPhrases[randomIndex];
        }
        const randomTime = Math.random() * 2000 + 3000;
        setTimeout(changeBubbleText, randomTime);
      }
      setTimeout(changeBubbleText, 3000);

      const webcam = document.getElementById('webcam');
      const startBtn = document.getElementById('start-btn');
      const retakeBtn = document.getElementById('retake-btn');
      const downloadBtn = document.getElementById('download-btn');
      const downloadVideoBtn = document.getElementById('download-video-btn');
      const countdownOverlay = document.getElementById('countdown-overlay');
      const flashEffect = document.getElementById('flash-effect');
      const flipBtn = document.getElementById('flip-btn');

      const photoStrip = document.getElementById('photo-strip');
      const photoLayer = document.querySelector('.photo-layer');
      const frameOverlay = document.getElementById('frame-overlay');
      const finalResultImg = document.getElementById('final-result-img');
      const frameOptions = document.querySelectorAll('.frame-option');

      const videoRecordCanvas = document.getElementById('video-record-canvas');
      const recordCtx = videoRecordCanvas.getContext('2d');

      let currentFacingMode = 'user'; 
      let mediaRecorder = null;
      let recordedChunks = [];
      let recordedVideoBlob = null;
      let isRecordingActive = false;

      const FRAME_CONFIGS = {
        4: {
          positions: [
            { left: 18, top: 32, width: 204, height: 141 },
            { left: 18, top: 178.8, width: 204, height: 141 },
            { left: 18, top: 325.6, width: 204, height: 141 },
            { left: 18, top: 472.4, width: 204, height: 141 }
          ]
        }
      };

      let currentSlots = 4;
      let PHOTO_POSITIONS = FRAME_CONFIGS[4].positions;
      let canvases = [
        document.getElementById('canvas1'),
        document.getElementById('canvas2'),
        document.getElementById('canvas3'),
        document.getElementById('canvas4')
      ];

      function initCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("您的瀏覽器不支援相機功能！");
          return;
        }

        if (webcam.srcObject) {
          webcam.srcObject.getTracks().forEach(track => track.stop());
        }

        navigator.mediaDevices.getUserMedia({ 
          video: { 
            width: { ideal: 1280 }, 
            height: { ideal: 960 }, 
            facingMode: currentFacingMode 
          } 
        })
        .then(stream => { 
          webcam.srcObject = stream;
          webcam.play().catch(e => console.log(e));

          if (currentFacingMode === 'user') {
            webcam.classList.remove('rear-camera');
            webcam.classList.add('front-camera');
          } else {
            webcam.classList.remove('front-camera');
            webcam.classList.add('rear-camera');
          }
        })
        .catch(err => {
          navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { 
              webcam.srcObject = stream;
              webcam.play().catch(e => console.log(e));
              if (currentFacingMode === 'user') {
                webcam.classList.remove('rear-camera');
                webcam.classList.add('front-camera');
              } else {
                webcam.classList.remove('front-camera');
                webcam.classList.add('rear-camera');
              }
            })
            .catch(e => {
              alert("無法開啟相機，請確認是否授權相機權限或使用 HTTPS 連線！");
            });
        });
      }

      flipBtn.addEventListener('click', () => {
        currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
        initCamera();
      });

      initCamera();

      function rebuildPhotoLayer(slots) {
        photoLayer.innerHTML = '';
        for (let i = 0; i < slots; i++) {
          const pos = PHOTO_POSITIONS[i];
          photoLayer.innerHTML += `<div class="photo-frame" style="top: ${pos.top}px; left: ${pos.left}px; width: ${pos.width}px; height: ${pos.height}px; display: flex;"><canvas id="canvas${i + 1}"></canvas></div>`;
        }
        canvases = [];
        for (let i = 1; i <= slots; i++) {
          canvases.push(document.getElementById(`canvas${i}`));
        }
      }

      let hasShot = false;

      frameOptions.forEach(option => {
        option.addEventListener('click', (e) => {
          if (hasShot) return;
          
          const activeOld = document.querySelector('.frame-option.active');
          if (activeOld) activeOld.classList.remove('active');
          
          const targetOption = e.currentTarget;
          targetOption.classList.add('active');

          const selectedFrame = targetOption.getAttribute('data-frame');
          currentSlots = parseInt(targetOption.getAttribute('data-slots')) || 4;
          PHOTO_POSITIONS = FRAME_CONFIGS[4].positions;

          rebuildPhotoLayer(currentSlots);
          startBtn.innerText = `2. 開始拍照 (START)`;
          frameOverlay.src = `${selectedFrame}.png`;
        });
      });

      function renderFrameToContext(ctx, targetWidth, targetHeight, sourceVideoOrCanvas, isLiveVideo, activeFacing) {
        const vWidth = sourceVideoOrCanvas.videoWidth || sourceVideoOrCanvas.width || 640;
        const vHeight = sourceVideoOrCanvas.videoHeight || sourceVideoOrCanvas.height || 480;
        const videoAspect = vWidth / vHeight;
        const targetAspect = targetWidth / targetHeight;

        let sWidth, sHeight, sx, sy;
        if (videoAspect > targetAspect) {
          sHeight = vHeight;
          sWidth = vHeight * targetAspect;
          sx = (vWidth - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = vWidth;
          sHeight = vWidth / targetAspect;
          sx = 0;
          sy = (vHeight - sHeight) / 2;
        }

        ctx.save();
        if (isLiveVideo && activeFacing === 'user') {
          ctx.translate(targetWidth, 0);
          ctx.scale(-1, 1);
        }

        ctx.drawImage(sourceVideoOrCanvas, sx, sy, sWidth, sHeight, 0, 0, targetWidth, targetHeight);
        ctx.restore();
      }

      function takePhoto(canvas) {
        if (!canvas) return;
        const targetWidth = canvas.width || 510;
        const targetHeight = canvas.height || 352;
        const ctx = canvas.getContext('2d');
        renderFrameToContext(ctx, targetWidth, targetHeight, webcam, true, currentFacingMode);
      }

      function renderAllActiveFrames(currentActiveIndex) {
        recordCtx.clearRect(0, 0, 240, 720);

        PHOTO_POSITIONS.forEach((pos, idx) => {
          recordCtx.save();
          recordCtx.beginPath();
          if (typeof recordCtx.roundRect === 'function') {
            recordCtx.roundRect(pos.left, pos.top, pos.width, pos.height, 12);
          } else {
            recordCtx.rect(pos.left, pos.top, pos.width, pos.height);
          }
          recordCtx.clip();

          const sourceToDraw = (idx < currentActiveIndex && canvases[idx] && canvases[idx].width > 0) ? canvases[idx] : webcam;
          const isLive = !(idx < currentActiveIndex && canvases[idx] && canvases[idx].width > 0);

          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = pos.width;
          tempCanvas.height = pos.height;
          const tempCtx = tempCanvas.getContext('2d');
          
          renderFrameToContext(tempCtx, pos.width, pos.height, sourceToDraw, isLive, currentFacingMode);
          recordCtx.drawImage(tempCanvas, pos.left, pos.top);
          recordCtx.restore();
        });

        if (frameOverlay.complete && frameOverlay.naturalWidth !== 0) {
          recordCtx.drawImage(frameOverlay, 0, 0, 240, 720);
        }
      }

      function startRecordingLoop(currentActiveIndex) {
        if (!isRecordingActive) return;
        renderAllActiveFrames(currentActiveIndex);
        requestAnimationFrame(() => startRecordingLoop(currentActiveIndex));
      }

      function run5SecCountdown(seconds) {
        return new Promise(resolve => {
          let count = seconds;
          countdownOverlay.innerText = count;
          void countdownOverlay.offsetHeight;

          const timer = setInterval(() => {
            count--;
            if (count > 0) {
              countdownOverlay.innerText = count;
              void countdownOverlay.offsetHeight;
            } else {
              clearInterval(timer);
              countdownOverlay.innerText = '';
              resolve();
            }
          }, 1000);
        });
      }

      async function startPhotography() {
        startBtn.disabled = true;
        retakeBtn.disabled = true;
        downloadBtn.disabled = true;
        downloadVideoBtn.disabled = true;
        finalResultImg.style.display = 'none';
        finalResultImg.classList.remove('printing-animation');
        hasShot = false;
        recordedChunks = [];

        // 拍照開始時重置炸彈狀態
        bombContainer.classList.remove('exploding');
        shockwave.classList.remove('active');

        rebuildPhotoLayer(currentSlots);

        canvases.forEach((c, idx) => {
          if (c && PHOTO_POSITIONS[idx]) {
            c.width = PHOTO_POSITIONS[idx].width * 2;
            c.height = PHOTO_POSITIONS[idx].height * 2;
            c.getContext('2d').clearRect(0, 0, c.width, c.height);
          }
        });

        if (videoRecordCanvas.captureStream && window.MediaRecorder) {
          try {
            const recordStream = videoRecordCanvas.captureStream(30);
            let options = {};
            if (MediaRecorder.isTypeSupported('video/mp4')) {
              options = { mimeType: 'video/mp4' };
            } else if (MediaRecorder.isTypeSupported('video/webm')) {
              options = { mimeType: 'video/webm' };
            }

            mediaRecorder = new MediaRecorder(recordStream, options);
            mediaRecorder.ondataavailable = (e) => {
              if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.start(100);
            isRecordingActive = true;
          } catch (e) {
            console.log("錄影不支援：", e);
          }
        }

        for (let i = 0; i < currentSlots; i++) {
          startRecordingLoop(i);
          await run5SecCountdown(5);
          
          isRecordingActive = false;
          triggerFlash();
          takePhoto(canvases[i]); 
          isRecordingActive = true;
        }

        isRecordingActive = false;
        await new Promise(r => setTimeout(r, 1000));

        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
          mediaRecorder.onstop = () => {
            const mime = mediaRecorder.mimeType || 'video/mp4';
            recordedVideoBlob = new Blob(recordedChunks, { type: mime });
            downloadVideoBtn.disabled = false;
          };
        }

        hasShot = true;
        
        // 💥 拍完照瞬間觸發炸彈爆炸特效
        bombContainer.classList.add('exploding');
        shockwave.classList.add('active');

        generateFinalImage();

        startBtn.disabled = false;
        retakeBtn.disabled = false;
        downloadBtn.disabled = false;
      }

      function triggerFlash() {
        flashEffect.classList.add('flash-active');
        setTimeout(() => {
          flashEffect.classList.remove('flash-active');
        }, 120);
      }

      function generateFinalImage() {
        html2canvas(photoStrip, { 
          scale: 2, 
          useCORS: true,
          backgroundColor: null
        }).then(canvas => {
          const dataUrl = canvas.toDataURL('image/png');
          finalResultImg.src = dataUrl;
          finalResultImg.style.display = 'block';
          finalResultImg.classList.add('printing-animation');
        }).catch(err => {
          alert("生成圖片時發生錯誤！");
        });
      }

      retakeBtn.addEventListener('click', () => {
        canvases.forEach(canvas => {
          if (canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        });
        finalResultImg.style.display = 'none';
        finalResultImg.classList.remove('printing-animation');
        hasShot = false;
        downloadBtn.disabled = true;
        downloadVideoBtn.disabled = true;

        // 重新拍照時恢復炸彈
        bombContainer.classList.remove('exploding');
        shockwave.classList.remove('active');
      });

      downloadBtn.addEventListener('click', () => {
        if (finalResultImg.src && hasShot) {
          const link = document.createElement('a');
          link.download = `BTS_Kaohsiung_${Date.now()}.png`;
          link.href = finalResultImg.src;
          link.click();
        }
      });

      downloadVideoBtn.addEventListener('click', () => {
        if (recordedVideoBlob) {
          const url = URL.createObjectURL(recordedVideoBlob);
          const a = document.createElement('a');
          const ext = recordedVideoBlob.type.includes('mp4') ? 'mp4' : 'webm';
          a.href = url;
          a.download = `BTS_Kaohsiung_video_${Date.now()}.${ext}`;
          a.click();
          URL.revokeObjectURL(url);
        }
      });

      startBtn.addEventListener('click', startPhotography);
    });
  </script>
</body>
</html>
