<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BTS Online Photo Booth</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- 引入 BTS 風格的現代極簡無襯線字體 Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box !important;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      font-family: 'Montserrat', Arial, sans-serif;
      position: relative;
      margin: 0;
    }

    /* 手機與電腦皆可完美顯示背景的寫法 */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('底圖.jpg') no-repeat center center;
      background-size: cover;
      z-index: -999;
    }

    /* 拍貼框主容器：50% 透明度黑色 */
    .container {
      position: relative;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      width: 780px;
      max-width: 95vw;
    }

    .booth-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 8px;
      margin-bottom: 6px;
    }

    .booth-title {
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .spotify-badge {
      background-color: #1db954;
      color: #000;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 900;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
    }

    /* 標題樣式 */
    .sub-header-title {
      text-align: center;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #ef4444; /* 改為紅色 */
      margin-bottom: 15px;
      font-weight: 800;
    }

    .main-layout {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
    }

    .controls-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 50;
    }

    .preview-panel {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .camera-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #webcam.front-camera {
      transform: scaleX(-1);
    }

    #webcam.rear-camera {
      transform: scaleX(1);
    }

    #flash-effect {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      transition: opacity 0.1s ease-out;
    }

    #flash-effect.flash-active {
      opacity: 0.95;
    }

    /* 倒數計時數字為紅色 */
    #countdown-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 70px;
      font-weight: 900;
      color: #ef4444;
      text-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 10px rgba(239, 68, 68, 0.8);
      z-index: 999;
    }

    .flip-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 80;
      transition: all 0.2s ease;
    }

    .flip-btn:hover {
      background: rgba(56, 189, 248, 0.8);
      transform: rotate(180deg);
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      position: relative;
      z-index: 100;
      flex: 1;
      padding: 10px 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      color: #111;
      background: #e2e8f0;
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: #334155;
      color: #94a3b8;
      border-color: #475569;
    }

    .btn.secondary {
      background: #cbd5e1;
      color: #1e293b;
    }

    .btn.success {
      margin-top: 10px;
      width: 100%;
      font-size: 13px;
      background: #7dd3fc;
      color: #0f172a;
      border-color: #38bdf8;
    }

    .btn.video-btn {
      margin-top: 8px;
      width: 100%;
      font-size: 13px;
      background: #d4c5b9;
      color: #2c2521;
      border-color: #b5a395;
    }

    .picker-group {
      margin-top: 10px;
      width: 100%;
    }

    .picker-group label {
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 4px;
      display: block;
    }

    .options-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
    }

    .frame-option {
      height: 40px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 6px;
      cursor: pointer;
      overflow: hidden;
    }

    .frame-option.active {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }

    .frame-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    #photo-strip {
      position: relative;
      width: 240px;
      height: 720px;
      background-color: transparent;
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .photo-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    .photo-frame {
      position: absolute;
      left: 18px;
      width: 204px;
      height: 141px;
      background-color: #000;
      overflow: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-frame canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #frame-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      z-index: 5;
      pointer-events: none;
    }

    #final-result-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 20;
      object-fit: fill;
      cursor: pointer;
      display: none;
    }

    #final-result-img.printing-animation {
      animation: photoPrintSlide 1.8s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    @keyframes photoPrintSlide {
      0% { transform: translateY(-100%); opacity: 0.1; filter: brightness(2.5) contrast(0.5); }
      50% { opacity: 0.7; filter: brightness(1.3) contrast(0.9); }
      100% { transform: translateY(0); opacity: 1; filter: brightness(1) contrast(1); }
    }

    /* 左下角炸彈樣式 */
    .bottom-left-bomb {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 100px;
      height: 100px;
      z-index: 99999;
      pointer-events: none;
    }

    .bottom-left-bomb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.9));
    }

    @media (max-width: 650px) {
      .main-layout { flex-direction: column; align-items: center; }
      .container { width: 100%; padding: 12px; }
      .controls-panel { width: 100%; }
      .bottom-left-bomb { bottom: 10px; left: 10px; width: 70px; height: 70px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="booth-header">
      <h1 class="booth-title">BTS Online Photo Booth</h1>
      <div class="spotify-badge">Spotify</div>
    </div>
    
    <div class="sub-header-title">BTS WORLD TOUR 'ARIRANG' IN KAOHSIUNG</div>

    <div class="main-layout">
      <!-- 左側控制與相機面板 -->
      <div class="controls-panel">
        <div class="camera-container">
          <video id="webcam" autoplay playsinline muted></video>
          <div id="flash-effect"></div>
          <div id="countdown-overlay"></div>
          <button id="flip-btn" class="flip-btn" title="切換前後鏡頭">🔄</button>
