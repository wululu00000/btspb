<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BTS Online Photo Booth</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <style>
    * {
      box-sizing: border-box !important;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background: url('底圖.jpg') no-repeat center center fixed !important;
      background-size: cover !important;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      font-family: Arial, sans-serif;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(18, 20, 28, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      width: 780px;
      max-width: 95vw;
    }

    .booth-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 8px;
      margin-bottom: 6px;
    }

    /* 標題字體調整為乾淨的粗體無襯線字體 */
    .booth-title {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .spotify-badge {
      background-color: #1db954;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
    }

    .sub-header-title {
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      color: #38bdf8;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .main-layout {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
    }

    .controls-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 50;
    }

    .preview-panel {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .camera-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #webcam.front-camera {
      transform: scaleX(-1);
    }

    #webcam.rear-camera {
      transform: scaleX(1);
    }

    #flash-effect {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      transition: opacity 0.1s ease-out;
    }

    #flash-effect.flash-active {
      opacity: 0.95;
    }

    #countdown-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 70
